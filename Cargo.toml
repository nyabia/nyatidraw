[workspace]
resolver = "3"
exclude = ["third_party/wry", "third_party/dioxus-desktop"]
members = [
    "apps/cli",
    "apps/desktop",
    "crates/api",
    "crates/brush",
    "crates/diagnostics",
    "crates/document",
    "crates/editor",
    "crates/history",
    "crates/input",
    "crates/input-queue",
    "crates/input-platform",
    "crates/paint-gpu",
    "crates/paint-cpu",
    "crates/png-io",
    "crates/project",
    "crates/project-redb",
    "crates/stroke",
    "crates/tiles",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nyatidraw-api = { path = "crates/api" }
nyatidraw-brush = { path = "crates/brush" }
nyatidraw-diagnostics = { path = "crates/diagnostics" }
nyatidraw-document = { path = "crates/document" }
nyatidraw-editor = { path = "crates/editor" }
nyatidraw-history = { path = "crates/history" }
nyatidraw-input = { path = "crates/input" }
nyatidraw-input-queue = { path = "crates/input-queue" }
nyatidraw-input-platform = { path = "crates/input-platform" }
nyatidraw-paint-gpu = { path = "crates/paint-gpu" }
nyatidraw-paint-cpu = { path = "crates/paint-cpu" }
nyatidraw-png-io = { path = "crates/png-io" }
nyatidraw-project = { path = "crates/project" }
nyatidraw-project-redb = { path = "crates/project-redb" }
nyatidraw-stroke = { path = "crates/stroke" }
nyatidraw-tiles = { path = "crates/tiles" }
blake3 = "=1.8.7"
dioxus = { version = "=0.7.9", default-features = false, features = ["desktop", "launch", "lib"] }
dioxus-desktop = { version = "=0.7.9", default-features = false, features = ["tokio_runtime"] }
pollster = "=0.4.0"
raw-window-handle = { version = "=0.6.2", features = ["std"] }
wgpu = "=26.0.1"
png = "=0.17.16"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Wry #1799 backport for the version required by Dioxus Desktop 0.7.9.
# See third_party/wry/NYATIDRAW.md for provenance and removal criteria.
[patch.crates-io]
wry = { path = "third_party/wry" }
dioxus-desktop = { path = "third_party/dioxus-desktop" }

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
