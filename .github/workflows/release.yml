name: Windows alpha release
on:
  push:
    tags: ['v*-alpha.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha-release
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'nyabia/nyatidraw'
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve release version
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') { throw 'Release requires an existing version tag; select a tag for manual execution.' }
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+-alpha\.\d+$') { throw 'Invalid release tag' }
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+-alpha\.\d+$') { throw 'Invalid alpha version' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install pinned Rust
        run: |
          $version = (Select-String '^channel = "([^"]+)"' rust-toolchain.toml).Matches.Groups[1].Value
          rustup toolchain install $version --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false
      - name: Verify source
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --all-features --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: |
          ./tools/setup-ci.ps1
          ./tools/build-dev.ps1
      - name: Package installer and update feed
        run: ./tools/package-release.ps1 -Version $env:RELEASE_VERSION
      - name: Upload assets and publish alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem "target/releases/$env:RELEASE_VERSION" -File | ForEach-Object FullName
          if (-not $files) { throw 'No release assets were produced.' }
          $notes = "Windows x64 alpha. Automated source checks and packaging passed. Hardware and installation coverage is documented in docs/releasing.md; CI does not replace those checks."
          $notesFile = "docs/releases/$env:RELEASE_VERSION.md"
          if (-not (Test-Path -LiteralPath $notesFile)) {
            $notesFile = 'target/release-notes.txt'
            $notes | Set-Content $notesFile -Encoding utf8NoBOM
          }
          # Keep partially uploaded assets private. Never create a missing tag or overwrite an existing release.
          gh release create "v$env:RELEASE_VERSION" @files --repo $env:GITHUB_REPOSITORY --verify-tag --draft --prerelease --title "NyatiDraw $env:RELEASE_VERSION" --notes-file $notesFile --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "v$env:RELEASE_VERSION" --repo $env:GITHUB_REPOSITORY --verify-tag --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  website:
    needs: package
    permissions:
      contents: read
      pages: write
      id-token: write
    # GITHUB_TOKEN release events do not start another workflow. Call Pages directly.
    uses: ./.github/workflows/pages.yml
