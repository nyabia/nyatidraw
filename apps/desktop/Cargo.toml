[package]
name = "nyatidraw-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dioxus.workspace = true
dioxus-desktop.workspace = true
nyatidraw-api.workspace = true
nyatidraw-brush.workspace = true
nyatidraw-document.workspace = true
nyatidraw-editor.workspace = true
nyatidraw-input.workspace = true
nyatidraw-input-queue.workspace = true
nyatidraw-input-platform.workspace = true
nyatidraw-paint-gpu.workspace = true
nyatidraw-paint-cpu.workspace = true
nyatidraw-png-io.workspace = true
nyatidraw-project.workspace = true
nyatidraw-project-redb.workspace = true
nyatidraw-stroke.workspace = true
nyatidraw-tiles.workspace = true
pollster.workspace = true
raw-window-handle.workspace = true
wgpu.workspace = true

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.17.2", default-features = false }
velopack = "=1.2.0"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
