[package]
name = "nyatidraw-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "nyatidraw-gpui-desktop"

[features]
default = ["gpui"]
legacy-ui = ["dep:dioxus", "dep:dioxus-desktop", "nyatidraw-editor-ui/chrome"]
gpui = ["dep:gpui-kit", "dep:nyatidraw-editor-gpui", "dep:async-channel", "dep:base64"]

[[bin]]
name = "nyatidraw-desktop"
path = "src/main.rs"
required-features = ["legacy-ui"]

[[bin]]
name = "nyatidraw-gpui-desktop"
path = "src/gpui.rs"
required-features = ["gpui"]
test = false

[dependencies]
dioxus = { workspace = true, optional = true }
dioxus-desktop = { workspace = true, optional = true }
async-channel = { version = "=2.5.0", optional = true }
base64 = { version = "=0.22.1", optional = true }
gpui-kit = { workspace = true, optional = true }
nyatidraw-editor-gpui = { workspace = true, optional = true }
nyatidraw-api.workspace = true
nyatidraw-brush.workspace = true
nyatidraw-document.workspace = true
nyatidraw-editor.workspace = true
nyatidraw-editor-ui.workspace = true
nyatidraw-input.workspace = true
nyatidraw-input-queue.workspace = true
nyatidraw-input-platform.workspace = true
nyatidraw-paint-gpu.workspace = true
nyatidraw-paint-cpu.workspace = true
nyatidraw-png-io.workspace = true
nyatidraw-project.workspace = true
nyatidraw-project-redb.workspace = true
nyatidraw-stroke.workspace = true
nyatidraw-tiles.workspace = true
pollster.workspace = true
raw-window-handle.workspace = true
wgpu.workspace = true

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.17.2", default-features = false }
velopack = "=1.2.0"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_DirectComposition",
    "Win32_System_Com",
    "Win32_UI_Controls",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.12"
