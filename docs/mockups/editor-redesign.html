<script>(()=>{const front=document.querySelector('.color-chip.front'),hex=document.querySelector('#hex');const setColor=c=>{front.style.background=c;hex.textContent=c.toUpperCase()};document.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>setColor(b.dataset.color)));let z=100,r=0;const zv=document.querySelector('#zoom'),nz=document.querySelector('#nav-zoom');const renderZoom=()=>{zv.textContent=`${z}%`;nz.textContent=`${z}%`};const setZoom=d=>{z=Math.max(25,Math.min(400,z+d));renderZoom()};['#zoom-in','#nav-plus'].forEach(s=>document.querySelector(s).addEventListener('click',()=>setZoom(10)));['#zoom-out','#nav-minus'].forEach(s=>document.querySelector(s).addEventListener('click',()=>setZoom(-10)));document.querySelector('#nav-one').addEventListener('click',()=>{z=100;renderZoom()});document.querySelector('#nav-fit').addEventListener('click',()=>{z=78;renderZoom()});document.querySelector('#rotate').addEventListener('click',()=>{r=(r+15)%360;document.querySelector('#rotation').textContent=`${r}°`});const rows=[...document.querySelectorAll('.layer-row')],colorToggle=document.querySelector('#layer-color-toggle'),colorSwatch=document.querySelector('#layer-color-swatch'),referenceToggle=document.querySelector('#reference-toggle');let selected=document.querySelector('.layer-row.active'),soloId=null,colorIndex=0;const colors=['#43a9df','#e36a77','#9b72cf','#63b36f'];const bool=(row,key)=>row.dataset[key]==='true';const updateRow=row=>{row.classList.toggle('colorized',bool(row,'colorized'));const detail=row.querySelector('.layer-detail');if(row.dataset.group==='true'){const count=rows.filter(r=>r.dataset.parent===row.dataset.layerId).length;detail.textContent=`그룹 · ${count}개`;return}const states=[];if(bool(row,'reference'))states.push('<i class="state-badge"><svg class="icon"><use href="#reference"/></svg></i>참조');if(bool(row,'colorized'))states.push('<i class="state-badge color"></i>색상화');states.push('100%');detail.innerHTML=states.join(' · ')};const syncSettings=()=>{colorToggle.setAttribute('aria-pressed',String(bool(selected,'colorized')));referenceToggle.setAttribute('aria-pressed',String(bool(selected,'reference')));colorSwatch.style.background=selected.style.getPropertyValue('--layer-color')||colors[0]};const select=row=>{rows.forEach(r=>r.classList.toggle('active',r===row));selected=row;syncSettings()};rows.forEach(row=>{row.addEventListener('click',()=>select(row));updateRow(row)});document.querySelectorAll('.layer-eye').forEach(b=>b.addEventListener('click',()=>{const v=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!v));b.classList.toggle('hidden',v)}));document.querySelectorAll('.layer-solo').forEach(b=>b.addEventListener('click',()=>{const source=b.closest('.layer-row'),id=source.dataset.layerId;soloId=soloId===id?null:id;rows.forEach(row=>{const allowed=!soloId||row.dataset.layerId===soloId||row.dataset.parent===soloId||source.dataset.parent===row.dataset.layerId;row.classList.toggle('solo-muted',!allowed);row.classList.toggle('solo-source',row.dataset.layerId===soloId);row.querySelector('.layer-solo').setAttribute('aria-pressed',String(row.dataset.layerId===soloId))})}));document.querySelectorAll('.layer-row.group .layer-tree').forEach(b=>b.addEventListener('click',()=>{const group=b.closest('.layer-row'),collapsed=!group.classList.contains('is-collapsed');group.classList.toggle('is-collapsed',collapsed);b.setAttribute('aria-expanded',String(!collapsed));rows.filter(r=>r.dataset.parent===group.dataset.layerId).forEach(r=>r.hidden=collapsed)}));colorToggle.addEventListener('click',()=>{selected.dataset.colorized=String(!bool(selected,'colorized'));updateRow(selected);syncSettings()});referenceToggle.addEventListener('click',()=>{selected.dataset.reference=String(!bool(selected,'reference'));updateRow(selected);syncSettings()});colorSwatch.addEventListener('click',()=>{colorIndex=(colorIndex+1)%colors.length;selected.style.setProperty('--layer-color',colors[colorIndex]);selected.dataset.colorized='true';updateRow(selected);syncSettings()});syncSettings()})();</script>
<script>(()=>{const marker=document.createElement('div');marker.className='dock-insert-marker';marker.setAttribute('aria-hidden','true');document.body.append(marker);let dragSource=null,activeZone=null;const handles=[];document.querySelectorAll('.dock-panel,.right-panel').forEach(panel=>{const handle=panel.querySelector(':scope > .panel-head');if(handle)handles.push([handle,panel])});const toolRail=document.querySelector('.tool-rail');if(toolRail)handles.push([toolRail.querySelector(':scope > .micro-head'),toolRail]);document.querySelectorAll('.commandbar > .toolbar-dock').forEach(toolbar=>handles.push([toolbar.querySelector(':scope > .toolbar-grip'),toolbar]));const hideMarker=()=>{marker.className='dock-insert-marker';activeZone=null};const placeMarker=(kind,left,top,width,height,zone)=>{marker.className=`dock-insert-marker ${kind} visible`;Object.assign(marker.style,{left:`${Math.round(left)}px`,top:`${Math.round(top)}px`,width:`${Math.round(width)}px`,height:`${Math.round(height)}px`});activeZone=zone};handles.forEach(([handle,item])=>{if(!handle)return;handle.draggable=true;handle.addEventListener('dragstart',event=>{dragSource=item;item.classList.add('dock-drag-source');event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',item.querySelector('.panel-head')?.innerText||item.getAttribute('aria-label')||'도킹 패널')});handle.addEventListener('dragend',()=>{item.classList.remove('dock-drag-source');dragSource=null;hideMarker()})});document.addEventListener('dragover',event=>{if(!dragSource)return;const zone=event.target.closest('.commandbar,.left-dock,.right-dock');if(!zone){hideMarker();return}event.preventDefault();event.dataTransfer.dropEffect='move';const rect=zone.getBoundingClientRect();if(zone.classList.contains('commandbar')){const docks=[...zone.querySelectorAll(':scope > .toolbar-dock')];const before=docks.find(d=>event.clientX<d.getBoundingClientRect().left+d.getBoundingClientRect().width/2);const x=before?before.getBoundingClientRect().left:(docks.at(-1)?.getBoundingClientRect().right||rect.right);placeMarker('vertical',x-2,rect.top+4,5,rect.height-8,zone);return}const panels=[...zone.children].filter(child=>child.matches('.dock-panel,.right-panel'));const before=panels.find(panel=>event.clientY<panel.getBoundingClientRect().top+panel.getBoundingClientRect().height/2);const y=before?before.getBoundingClientRect().top:(panels.at(-1)?.getBoundingClientRect().bottom||rect.top+3);placeMarker('horizontal',rect.left+3,y-2,rect.width-6,5,zone)});document.addEventListener('drop',event=>{if(!dragSource||!activeZone)return;event.preventDefault();const zone=activeZone;hideMarker();zone.classList.add('dock-drop-flash');setTimeout(()=>zone.classList.remove('dock-drop-flash'),180);dragSource.classList.remove('dock-drag-source');dragSource=null});document.addEventListener('dragend',hideMarker)})();</script>
