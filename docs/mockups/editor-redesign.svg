      <path d="M0 0h12v12H0zm12 12h12v12H12z" fill="#e6ebee"/>
    </pattern>
    <linearGradient id="canvasGlaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="svSquare" x1="0" y1="0" x2="1" y2="1">
