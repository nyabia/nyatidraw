<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>NyatiDraw — exploratory editor redesign</title>
  <desc>Exploratory, unapproved vector mockup for later manual iteration in Inkscape. Canvas checkerboard is confined to the drawable canvas. Icons use Lucide Static 1.39.0 paths (ISC license).</desc>
  <metadata>
    <design-status>exploratory / unapproved / intended for manual refinement</design-status>
    <icon-provenance>Lucide Static 1.39.0, ISC, https://github.com/lucide-icons/lucide</icon-provenance>
  </metadata>
  <defs>
