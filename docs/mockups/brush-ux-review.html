<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NyatiDraw — 속성 UX 검토</title>
<style>
:root{color-scheme:dark;--panel:#777;--head:#505050;--input:#454545;--stage:#1b1b1b;--line:#999}*{box-sizing:border-box}body{margin:0;background:var(--stage);color:#fafafa;font:13px/1.35 'Segoe UI','Malgun Gothic',sans-serif}button,input{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer}button:hover{background:#616161}button:focus-visible,input:focus-visible{outline:2px solid white;outline-offset:-2px}input[type=number]{width:56px;height:26px;background:var(--input);border:1px solid #999;border-radius:2px;text-align:right;padding:2px 5px;appearance:textfield}input::-webkit-inner-spin-button{appearance:none}input[type=range]{appearance:none;width:100%;height:4px;background:#484848;margin:9px 0 2px;cursor:pointer}input[type=range]::-webkit-slider-thumb{appearance:none;background:#eee;width:11px;height:11px;border:1px solid #444;border-radius:50%}button[aria-pressed=true]{box-shadow:inset 0 0 0 1px #eee;background:#515151}.app{height:100vh;display:grid;grid-template-rows:24px 42px 1fr}.title{padding:3px 8px;background:#333;font-size:12px}.bar{position:relative;background:#858585;display:flex;align-items:center;padding:0 5px}.actions,.menus{display:flex;align-items:center;height:100%;gap:2px}.actions>button,.menus>button{height:34px;min-width:36px;padding:0 9px}.actions small{font-size:11px;vertical-align:sub;margin-left:4px;font-weight:600}.dock-inline{display:flex;align-items:center;height:36px;border-right:1px solid #aaa}.dock-inline:before{content:'✣';display:grid;place-items:center;background:var(--head);height:100%;width:12px;font-size:10px;margin-right:4px}.dock-inline button{height:32px;padding:0 8px}.swatches{display:grid;grid-template-columns:repeat(6,15px);gap:2px;margin:0 7px}.swatches i{height:13px;background:var(--c);border:1px solid #666}.menus{position:absolute;inset:0;background:#858585;padding:0 5px;z-index:20}.menus[hidden]{display:none}.menus>button:first-child{font-size:20px}.menu-popup{position:absolute;top:42px;left:42px;width:220px;padding:5px;background:#565656;border:1px solid #999;box-shadow:0 4px 12px #0008;z-index:25}.menu-popup button{display:flex;width:100%;justify-content:space-between;padding:8px 10px}.menu-popup[hidden]{display:none}.workspace{display:grid;grid-template-columns:44px 224px minmax(0,1fr) 248px;gap:4px;min-height:0;padding-top:4px}.rail{background:var(--panel)}.head{height:23px;display:flex;gap:5px;align-items:center;padding:0 6px;background:var(--head);font-size:12px;flex:none}.head:before{content:'✣';color:#ddd;font-size:12px}.rail button{display:block;position:relative;width:100%;height:40px;font-size:23px}.rail sub{position:absolute;right:3px;bottom:3px;font-size:12px;font-weight:600}.rail hr{width:26px;border:0;border-top:1px solid #bbb;margin:5px auto}.stack{display:flex;flex-direction:column;gap:4px;min-height:0}.panel{background:var(--panel);min-height:0}.props{position:relative}.body{padding:8px}.preview{height:40px;background:#555;margin-bottom:8px;display:flex;align-items:center;padding:5px 8px}.preview svg{width:100%;height:30px;fill:#f5f5f5}.control{margin-bottom:10px}.control:last-of-type{margin-bottom:4px}.control-line{display:grid;grid-template-columns:minmax(0,1fr) 56px 18px 47px;align-items:center;gap:3px}.unit{font-size:11px;color:#eee}.pressure{height:26px;font-size:12px;border:1px solid #999;border-radius:2px;padding:0}.control-line.no-pressure{grid-template-columns:minmax(0,1fr) 56px 18px 47px}.disclose{width:100%;height:26px;text-align:left;padding:0;color:#eee;font-size:12px}.quick{display:flex;flex:1;flex-direction:column;min-height:0}.quick .body{display:flex;flex-direction:column;min-height:0;flex:1;padding-top:5px}.recent{display:grid;grid-template-columns:27px repeat(4,1fr);align-items:center;border-bottom:1px solid #aaa;padding-bottom:5px;gap:1px}.recent>span{font-size:11px;color:#eee}.recent button{height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px}.dot{display:inline-block;border-radius:50%;background:#eee;width:var(--d);height:var(--d);flex:none}.sizes{overflow:auto;flex:1;min-height:0;padding-top:4px;scrollbar-width:thin}.size{display:flex;align-items:center;gap:14px;width:100%;height:28px;border-bottom:1px solid #ffffff25;text-align:left;padding:0 10px}.size .dot-wrap{width:30px;display:flex;justify-content:center}.combined{flex:1;display:flex;flex-direction:column;min-height:0}.combined .props{flex:none}.combined .quick{border-top:1px solid #aaa}.body-title{font-size:12px;padding:7px 8px 0}.popover{position:absolute;top:95px;left:calc(100% + 8px);width:242px;z-index:30;background:#606060;border:1px solid #aaa;box-shadow:0 5px 20px #0008;padding:12px}.popover[hidden]{display:none}.popover h3{font-size:13px;margin:0 0 12px}.popover .toggle{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.popover label{display:flex;align-items:center;justify-content:space-between}.hint{display:flex;justify-content:space-between;font-size:11px;color:#ddd}.subtools button{display:flex;align-items:center;gap:8px;width:100%;height:32px;text-align:left;padding:0 8px}.stroke{height:4px;width:78px;background:#eee;border-radius:50%;transform:rotate(-7deg)}.stage{position:relative;display:grid;place-items:center;overflow:hidden;min-width:0}.page{width:min(calc(100% - 40px),calc((100vh - 126px)*16/9));aspect-ratio:16/9;outline:2px solid black;background:conic-gradient(#e4e4e4 25%,#fafafa 0 50%,#e4e4e4 0 75%,#fafafa 0) 0 0/16px 16px;position:relative}.page-note{position:absolute;bottom:-25px;color:#aaa;font-size:11px;left:0}.stage-note{position:absolute;bottom:8px;left:16px;font-size:11px;color:#aaa}.navigator .body{padding:10px}.mini{height:104px;background:#333;display:grid;place-items:center}.mini-page{width:90%;aspect-ratio:16/9;background:conic-gradient(#ddd 25%,white 0 50%,#ddd 0 75%,white 0) 0 0/8px 8px;border:1px solid #111}.nav-buttons{display:flex;justify-content:center;gap:12px;padding-top:6px}.wheel{width:164px;height:164px;border-radius:50%;margin:3px auto 8px;background:conic-gradient(red,#ff0,#0f0,#0ff,#00f,#f0f,red);position:relative}.wheel:before{content:'';position:absolute;inset:17px;border-radius:50%;background:#777}.wheel:after{content:'';position:absolute;inset:37px;background:linear-gradient(to top,black,transparent),linear-gradient(to right,white,red);border:1px solid #444}.color-row{display:flex;justify-content:space-between;align-items:center}.color-box{width:23px;height:23px;background:#151515;border:1px solid #ddd}.layers{flex:1}.layer-actions{padding:4px 8px;border-bottom:1px solid #999;display:flex;gap:10px}.layer-actions button{height:26px;min-width:25px;font-size:18px}.layer{display:flex;align-items:center;gap:8px;padding:7px;background:#606060;border:1px solid #ccc;margin:5px}.thumb{width:58px;height:58px;background:conic-gradient(#ddd 25%,white 0 50%,#ddd 0 75%,white 0) 0 0/10px 10px;flex:none}.layer-meta{min-width:0;flex:1}.layer-meta small{display:block;color:#ddd;margin-top:4px}.mode-label{margin-left:auto;color:#eee;font-size:11px;padding:0 8px}.compare{max-width:760px;margin:auto;padding:20px 24px}.compare h1{font-size:19px;margin:0 0 5px}.compare>p{color:#bbb;margin:0 0 20px;font-size:13px}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.compare-column>h2{font-size:17px;margin:0 0 10px}.compare-column>.stack{height:615px}.compare .control-line{grid-template-columns:minmax(0,1fr) 64px 19px 52px}.compare input[type=number]{width:64px}.compare .preview{height:43px}.compare .sizes{max-height:224px}.detail-example{margin-top:22px;max-width:360px}.detail-example h2{font-size:15px;margin:0 0 8px}.detail-example .popover{position:static;width:100%;box-shadow:none}.compare-footer{font-size:12px;color:#bbb;margin-top:16px}@media(max-width:1450px){.workspace{grid-template-columns:42px 210px minmax(0,1fr) 224px}.mode-label{display:none}}@media(max-width:650px){.compare{padding:12px}.compare-grid{gap:10px}.compare .control-line{grid-template-columns:1fr 52px 16px}.compare .pressure{grid-column:1;grid-row:2;text-align:left;width:55px}.compare input[type=number]{width:52px}}
</style>
<style>
input[type=checkbox]{accent-color:#ddd}
.mini-page{width:min(90%,180px)}
.compare-column>.stack{width:224px;height:575px;zoom:1.45}
.control-line,.compare .control-line{grid-template-columns:minmax(0,1fr) auto}
.numeric{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.numeric .unit{width:17px;text-align:right}
.sizes{display:flex;flex-wrap:wrap;align-content:flex-start;gap:3px;overflow:auto}
.size{flex:0 0 calc((100% - 6px)/3);width:auto;height:34px;gap:0;padding:0 4px;border:1px solid #ffffff30}
.size .dot-wrap,.size>span:last-child{flex:1 1 0;min-width:0;width:auto;margin:0}
.size>span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.size .dot{max-width:22px;max-height:22px}
.focus-review{width:224px;margin:12px auto;zoom:2}
.focus-review h1{font-size:13px;font-weight:400;margin:0 0 8px;color:#ddd}
.focus-review>.stack{height:565px}
.extras{border-top:1px solid #999;margin-top:5px;padding-top:8px}
.extras[hidden]{display:none}
.extra-field{margin:0 0 12px}
.extra-field>label{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.extra-min{display:flex;align-items:center;justify-content:space-between;font-size:12px}
.detail-example .extras{background:#777;padding:12px;border:0}
.compare .control-line input[type=number]{width:56px}
.compare .preview{height:40px}
.compare .sizes{max-height:none}
</style>
<div id="root"></div>
<script>
const params=new URLSearchParams(location.search);const isCompare=params.has('compare');const merge=false;
const strokeSvg='<svg viewBox="0 0 240 36" aria-label="브러시 미리보기" role="img"><path d="M0 27 Q45 -4 93 12 T240 18 Q174 39 112 24 T0 27"/></svg>';
function pressureDetail(hidden=true){return `<section class="extras" ${hidden?'hidden':''}>${[['크기',true,10],['불투명도',false,0]].map(([name,on,min])=>`<div class="extra-field"><label>${name}에 필압 적용<input type="checkbox" ${on?'checked':''} aria-label="${name}에 필압 적용"></label><label class="extra-min">최소 ${name}<span class="numeric"><input type="number" value="${min}" min="0" max="100" ${on?'':'disabled'} aria-label="최소 ${name}"><span class="unit">%</span></span></label></div>`).join('')}</section>`}
function controls(){return `<div class="props"><div class="body"><div class="preview">${strokeSvg}</div>${[['크기','5.0','px',5,200],['불투명도','100','%',100,100],['경도','80','%',80,100],['선 보정','0','',0,100]].map(([name,value,unit,range,max])=>`<div class="control" data-control="${name}"><div class="control-line"><label>${name}</label><span class="numeric"><input type="number" value="${value}" min="0" max="${max}" step="${name==='크기'?'0.1':'1'}" aria-label="${name}"><span class="unit">${unit}</span></span></div><input type="range" value="${range}" min="0" max="${max}" aria-label="${name} 슬라이더"></div>`).join('')}<button class="disclose" aria-expanded="false">추가 옵션 ▸</button>${pressureDetail()}</div></div>`}
function sizes(){return `<div class="body"><div class="recent"><span>최근</span>${[5,12,30,8].map(n=>`<button data-size="${n}" title="최근 크기 ${n}px"><i class="dot" style="--d:${Math.sqrt(n)*3}px"></i><span>${n}</span></button>`).join('')}</div><div class="sizes">${[1,2,3,5,8,10,15,20,30,40,80,120].map(n=>`<button class="size" data-size="${n}" aria-pressed="${n===5}" title="${n}px"><span class="dot-wrap"><i class="dot" style="--d:${Math.max(2,Math.sqrt(n)*2.1)}px"></i></span><span>${n}</span></button>`).join('')}</div></div>`}
function dock(merged){return merged?`<section class="panel combined"><div class="head">도구 속성</div>${controls()}<section class="quick"><div class="body-title">크기 빠른 선택</div>${sizes()}</section></section>`:`<section class="panel"><div class="head">도구 속성</div>${controls()}</section><section class="panel quick"><div class="head">크기 빠른 선택</div>${sizes()}</section>`}
function subtools(){return `<section class="panel subtools"><div class="head">세부 도구</div>${['펜','연필','브러시'].map((n,i)=>`<button aria-pressed="${i===0}"><i class="stroke" style="height:${[3,2,9][i]}px"></i>${n}</button>`).join('')}</section>`}
function toolbar(){return `<header class="bar"><div class="actions"><button id="burger" aria-label="메뉴 열기">☰</button><button>▱ 열기<small>Alt O</small></button><button>▣ 저장<small>S</small></button><button>↶<small>Z</small></button><button>↷<small>Shift Z</small></button><div class="dock-inline"><button>✳ 비우기</button><button>□ 변형</button></div><div class="dock-inline"><button>⛶</button><button>−</button><button>맞춤</button><button>＋</button><button>↻ 0°</button></div><div class="dock-inline"><span class="color-box" style="margin:0 7px"></span><div class="swatches">${['#111','#777','#ddd','#fff','#b55','#ba7','#dba','#586','#578','#768','#a69','#ccc'].map(c=>`<i style="--c:${c}"></i>`).join('')}</div></div></div><div class="mode-label">HTML 목업 · ${merge?'속성 통합':'패널 분리'}</div><nav class="menus" hidden><button id="close-menu" aria-label="메뉴 닫기">×</button>${['파일','편집','보기','레이어','선택','필터','도움말'].map(n=>`<button class="menu-item">${n}</button>`).join('')}</nav><div class="menu-popup" hidden><button>새 그림 <span>Ctrl N</span></button><button>열기… <span>Alt O</span></button><button>저장 <span>S</span></button><button>다른 이름으로 저장…</button><hr><button>내보내기…</button><button>설정…</button></div></header>`}
function right(){return `<aside class="stack right"><section class="panel navigator"><div class="head">내비게이터</div><div class="body"><div class="mini"><div class="mini-page"></div></div><div class="nav-buttons"><button>1:1</button><button>⛶</button><button>−</button><span>맞춤</span><button>＋</button></div></div></section><section class="panel"><div class="head">색상</div><div class="body"><div class="wheel"></div><div class="color-row"><span class="color-box"></span><span>#151515</span></div></div></section><section class="panel layers"><div class="head">레이어</div><div class="layer-actions"><button title="새 레이어">＋</button><button title="새 그룹">▱</button><button title="투명도 잠금">α</button><button title="클리핑">↳</button><button title="합성 방식" style="font-size:12px">Normal⌄</button></div><div class="layer"><span>◉</span><button>S</button><div class="thumb"></div><div class="layer-meta">레이어 1<small>100%</small></div></div></section></aside>`}
document.querySelector('#root').innerHTML=params.has('focus')?`<main class="focus-review"><h1>속성 + 빠른 크기 · 분리 유지</h1><div class="stack">${dock(false)}</div></main>`:isCompare?`<main class="compare"><h1>NyatiDraw · 속성 패널 비교</h1><p>동일한 조절 기능 · 숫자는 직접 입력 · 필압은 추가 옵션에만 표시</p><div class="compare-grid"><section class="compare-column"><h2>A · 합치기</h2><div class="stack">${dock(true)}</div></section><section class="compare-column"><h2>B · 분리 유지</h2><div class="stack">${dock(false)}</div></section></div><section class="detail-example"><h2>‘추가 옵션’을 펼쳤을 때</h2>${pressureDetail(false)}</section><p class="compare-footer">B는 크기 목록만 독립적으로 이동·숨김 가능. A는 도킹 제목 한 줄을 절약.</p></main>`:`<main class="app"><div class="title">NyatiDraw — 새 그림</div>${toolbar()}<div class="workspace"><aside class="rail"><div class="head"></div>${[['✥','g'],['⚚','g'],['♧','g'],null,['✎','b'],['⌁','b'],['╱','b'],null,['▱','e'],null,['▧','f'],['▥','f']].map(x=>x?`<button title="도구 그룹 ${x[1]}">${x[0]}<sub>${x[1]}</sub></button>`:'<hr>').join('')}</aside><aside class="stack left">${subtools()}${dock(merge)}</aside><section class="stage"><div class="page"><span class="page-note">1920 × 1080 · 16:9</span></div><span class="stage-note">페이지 밖도 그리기 가능 · 가운데 드래그로 이동</span></section>${right()}</div></main>`;
document.querySelectorAll('.control').forEach(row=>{const n=row.querySelector('input[type=number]'),r=row.querySelector('input[type=range]');n.oninput=()=>r.value=n.value;r.oninput=()=>n.value=r.value});
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const scope=b.closest('.stack');const n=scope.querySelector('[data-control="크기"] input[type=number]');n.value=b.dataset.size;n.dispatchEvent(new Event('input'));scope.querySelectorAll('.size').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.size===b.dataset.size)))});
document.querySelectorAll('.disclose').forEach(b=>b.onclick=()=>{const p=b.closest('.props').querySelector('.extras');p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden));b.textContent=p.hidden?'추가 옵션 ▸':'추가 옵션 ▾'});
document.querySelectorAll('.extra-field input[type=checkbox]').forEach(c=>c.onchange=()=>c.closest('.extra-field').querySelector('input[type=number]').disabled=!c.checked);
const menus=document.querySelector('.menus'),popup=document.querySelector('.menu-popup');if(menus){const close=()=>{menus.hidden=true;popup.hidden=true};document.querySelector('#burger').onclick=()=>menus.hidden=false;document.querySelector('#close-menu').onclick=close;document.querySelector('.menu-item').onclick=()=>popup.hidden=!popup.hidden;document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});if(params.has('menu'))menus.hidden=false;}
</script>
</html>
